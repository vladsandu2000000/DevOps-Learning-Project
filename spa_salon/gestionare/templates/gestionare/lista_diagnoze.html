<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista Diagnoze - Salon Spa</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 800px;
            margin: auto;
            overflow: hidden;
            padding: 0 2rem;
        }
        header {
            background: #333;
            color: #fff;
            padding-top: 30px;
            min-height: 70px;
            border-bottom: #bbb 5px solid;
        }
        header a {
            color: #fff;
            text-decoration: none;
            text-transform: uppercase;
            font-size: 16px;
        }
        header ul {
            margin: 0;
            padding: 0;
        }
        header li {
            list-style: none;
            display: inline;
            padding: 0 10px;
        }
        header nav ul {
            margin-top: 4px;
            float: right;
        }
        header nav li {
            display: inline;
            padding: 0 10px;
            margin-top: 10px;
        }
        header h1 {
            float: left;
            display: inline;
            padding: 0 20px 10px 0;
            text-transform: uppercase;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        table, th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        tr:hover {
            background-color: #f5f5f5;
        }
        .add-button {
            margin-top: 20px;
        }
        .add-button a {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            border-radius: 4px;
        }
        .add-button a:hover {
            background-color: #45a049;
        }
        footer {
            text-align: center;
            padding: 10px;
            margin-top: 20px;
            border-top: #bbb 5px solid;
            background: #333;
            color: #fff;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>Salon Spa</h1>
            <nav>
                <ul>
                    <li><a href="{% url 'home' %}">Acasă</a></li>
                    <li><a href="{% url 'lista_tratamente' %}">Servicii</a></li>
                    <li><a href="{% url 'lista_pacienti' %}">Clienți</a></li>
                    <li><a href="{% url 'lista_diagnoze' %}">Diagnoze</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="container">
        <h2>Lista Diagnoze</h2>
        <table>
            <thead>
                <tr>
                    <th>Diagnoză</th>
                    <th>Număr Pacienți</th>
                </tr>
            </thead>
            <tbody>
                {% for diagnoza in diagrame %}
                <tr>
                    <td>{{ diagnoza.Diagnoza }}</td>
                    <td>{{ diagnoza.numar_pacienti }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </section>

    <footer>
        <p>&copy; 2024 Salon Spa. Toate drepturile rezervate.</p>
    </footer>
</body>
</html>
